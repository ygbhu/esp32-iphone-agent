name: Android Agent

on:
  push:
    branches: [codex/android-agent-foundation]
    paths:
      - android-phone-agent/**
      - .github/workflows/android-agent.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-phone-agent/android
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install locked SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Test core and build debug APK
        run: ./gradlew --no-daemon --console=plain :core:test :app:assembleDebug
      - name: Audit built manifest and app sources
        run: python3 ../ci/audit-manifest.py --require-merged
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-tests
          path: |
            android-phone-agent/android/core/build/reports/tests/
            android-phone-agent/android/core/build/test-results/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: android-agent-debug
          path: android-phone-agent/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
